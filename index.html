<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .crop-container {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: -150px; /* 向上平移裁切顶部导航栏 */
      left: 0;
      width: 100%;
      height: calc(100vh + 260px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="crop-container">
    <iframe src="https://www.arealme.com/water-sort-puzzle/cn/" scrolling="no"></iframe>
  </div>
</body>
</html>
